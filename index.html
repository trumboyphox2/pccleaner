<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Cleaner Mini - Tải Phần Mềm Dọn Rác Máy Tính</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            text-align: center;
            padding: 50px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
        }
        p {
            color: #555;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            background-color: #27ae60;
            color: white;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #219653;
        }
        .note {
            font-size: 12px;
            color: #888;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>PC Cleaner Mini</h1>
        <p>Phần mềm dọn rác máy tính nhỏ gọn, giúp xóa file tạm và làm sạch thùng rác nhanh chóng chỉ với 1 cú click chuột. Bảo vệ không gian ổ cứng và tăng tốc độ máy tính của bạn.</p>
        
        <!-- Thay thế dấu # bên dưới bằng link tải file .exe của bạn -->

    </div>

</body>
